name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: building-blocks.sln
  UNIT_PROJECT: tests/UnitTests/UnitTests.csproj

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json', '.config/dotnet-tools.json', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: |
          dotnet restore "${{ env.SOLUTION }}"
          dotnet tool restore

      - name: Build
        run: |
          dotnet build "${{ env.SOLUTION }}" -c Release --no-restore \
            /p:EnableNETAnalyzers=false \
            /p:EnforceCodeStyleInBuild=false \
            /p:RunAnalyzersDuringBuild=false

      - name: InspectCode
        run: |
          dotnet tool run jb inspectcode "${{ env.SOLUTION }}" \
            --no-build \
            --severity=WARNING \
            --output=inspectcode.sarif.json \
            --format=Sarif \
            --verbosity=WARN

      - name: Summarize InspectCode results
        id: inspect_summary
        run: |
          set -euo pipefail
          REPORT=inspectcode.sarif.json
          if [ ! -f "$REPORT" ]; then
            echo "InspectCode report not found: $REPORT"
            exit 1
          fi

          ERRORS=$(jq '[.runs[].results[]? | select((.level // "warning") == "error")] | length' "$REPORT")
          WARNINGS=$(jq '[.runs[].results[]? | select((.level // "warning") == "warning")] | length' "$REPORT")
          NOTES=$(jq '[.runs[].results[]? | select((.level // "warning") == "note" or (.level // "") == "none")] | length' "$REPORT")

          {
            echo "## InspectCode"
            echo ""
            echo "| Severity | Count |"
            echo "|----------|------:|"
            echo "| Error | ${ERRORS} |"
            echo "| Warning | ${WARNINGS} |"
            echo "| Note/other | ${NOTES} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ERRORS" -gt 0 ] || [ "$WARNINGS" -gt 0 ]; then
            echo "::error::InspectCode found errors/warnings. See Job Summary / artifact."
            exit 1
          fi

      - name: Upload InspectCode report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: inspectcode-report
          path: inspectcode.sarif.json
          if-no-files-found: ignore
          retention-days: 1

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json', '.config/dotnet-tools.json', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: |
          dotnet restore "${{ env.SOLUTION }}"
          dotnet tool restore

      - name: Run unit tests with coverage gate
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/test-results/coverage"
          dotnet test "${{ env.UNIT_PROJECT }}" \
            -c Release \
            --no-restore \
            /p:EnableNETAnalyzers=false \
            /p:EnforceCodeStyleInBuild=false \
            /p:RunAnalyzersDuringBuild=false \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=cobertura \
            /p:CoverletOutput="${GITHUB_WORKSPACE}/test-results/coverage/coverage" \
            /p:Threshold=80 \
            /p:ThresholdType=line%2Cbranch \
            /p:ThresholdStat=minimum

      - name: Generate coverage report
        if: always()
        run: |
          dotnet tool run reportgenerator \
            "-reports:${GITHUB_WORKSPACE}/test-results/coverage/coverage.cobertura.xml" \
            "-targetdir:${GITHUB_WORKSPACE}/test-results/coverage-report" \
            "-reporttypes:Html;MarkdownSummaryGithub;TextSummary" \
            "-title:Unit test coverage"

      - name: Write coverage Job Summary
        if: always()
        run: |
          if [ -f ./test-results/coverage-report/SummaryGithub.md ]; then
            cat ./test-results/coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f ./test-results/coverage-report/Summary.txt ]; then
            {
              echo "## Unit test coverage"
              echo ""
              echo '```'
              cat ./test-results/coverage-report/Summary.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage summary not found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: test-results/coverage-report/
          if-no-files-found: warn
          retention-days: 1

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Begin SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet tool run dotnet-sonarscanner begin \
            /k:"fiap-vcosta_building-blocks" \
            /o:"fiap-vcosta" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.cs.cobertura.reportsPaths="${GITHUB_WORKSPACE}/test-results/coverage/coverage.cobertura.xml"

      - name: Build
        run: dotnet build "${{ env.SOLUTION }}" -c Release

      - name: Run unit tests with coverage
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/test-results/coverage"
          dotnet test "${{ env.UNIT_PROJECT }}" \
            -c Release \
            --no-build \
            /p:EnableNETAnalyzers=false \
            /p:EnforceCodeStyleInBuild=false \
            /p:RunAnalyzersDuringBuild=false \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=cobertura \
            /p:CoverletOutput="${GITHUB_WORKSPACE}/test-results/coverage/coverage"

      - name: End SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet tool run dotnet-sonarscanner end /d:sonar.token="${SONAR_TOKEN}"
